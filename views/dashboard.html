<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VeltoCloud</title>
<link rel="stylesheet" href="/output.css">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<meta name="description" content="VeltoCloud is a free platform for securely storing and sharing text and documents. Your data is encrypted before storage, with access restricted to you. Analyze documents with AI—with your permission—and get clear explanations in 20+ Indian languages.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%233b82f6'/%3E%3Cg%20transform='translate(12%2012)%20scale(1.6667)'%20fill='none'%20stroke='%23fff'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M7%2018a4%204%200%200%201-.5-7.97A5.5%205.5%200%200%201%2017%208.5a4.5%204.5%200%200%201%20.5%209.5H7z'/%3E%3Cpath%20d='M12%2016v-5m0%200-2%202m2-2%202%202'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100 antialiased">

  <!-- Header -->
  <header class="w-full border-b border-neutral-800 bg-neutral-950">
    <div class="flex h-16 items-center justify-between px-4 sm:px-6">

      <!-- Logo -->
      <a href="/" class="flex items-center gap-3">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-500 text-white">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 8.5a4.5 4.5 0 0 1 .5 9.5H7z" />
            <path d="M12 16v-5m0 0-2 2m2-2 2 2" />
          </svg>
        </span>
        <span class="text-xl font-semibold tracking-tight">VeltoCloud</span>
      </a>

      <!-- Right side -->
      <div class="flex items-center gap-2 sm:gap-3">
      
        <div class="hidden items-center gap-2 rounded-full bg-neutral-900 px-3 py-2 text-sm text-neutral-400 sm:flex">
          <svg class="h-4 w-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 5 6v5c0 4.5 3 8.5 7 10 4-1.5 7-5.5 7-10V6l-7-3z" />
            <path d="m9 12 2 2 4-4" />
          </svg>
          Private &amp; secure
        </div>
          <button type="button" id="chatButton" class="rounded-lg border cursor:pointer border-neutral-700 px-4 py-2 text-sm font-medium text-neutral-100 transition hover:bg-neutral-800 active:bg-neutral-700">
         <a href="/chat">Chat</a>
        </button>
        <button type="button" id="loginButton" class="rounded-lg border hidden cursor:pointer border-neutral-700 px-4 py-2 text-sm font-medium text-neutral-100 transition hover:bg-neutral-800 active:bg-neutral-700">
         <a href="/login"> Login</a>
        </button>
        <a href="/logout" class="rounded-lg bg-neutral-100 px-4 py-2 text-sm font-medium text-neutral-950 transition hover:bg-neutral-300 active:bg-neutral-400">
          Logout
        </a>
      </div>
    </div>
  </header>

  <main class="px-4 py-8 sm:px-6">

    <!-- Search -->
    <section class="flex flex-col gap-3 sm:flex-row">
      <div class="relative flex-1">
        <svg class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-neutral-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10" cy="10" r="6" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <input
          type="text"
          id="searchInput"
          maxlength="100"
          autocomplete="off"
          placeholder="Search by title or content"
          class="h-12 w-full rounded-xl border border-neutral-800 bg-neutral-900 pl-12 pr-4 text-base text-neutral-100 shadow-sm placeholder:text-neutral-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
        />
      </div>
      <button type="button" id="searchBtn" class="flex h-12 items-center justify-center gap-2 rounded-xl bg-blue-500 px-8 text-base font-semibold text-white shadow-sm transition hover:bg-blue-400 active:bg-blue-600">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10" cy="10" r="6" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        Search
      </button>
    </section>

    <!-- Filters -->
    <section id="filters" class="mt-5 flex flex-wrap gap-2">
      <button type="button" data-filter="public" class="rounded-lg mr-8  hover:cursor-pointer bg-blue-500 px-4 py-2 text-sm font-medium text-white transition hover:bg-blue-400 active:bg-blue-600">Public</button>

            <button type="button" data-filter="all" class="rounded-lg  hover:cursor-pointer border border-neutral-800 bg-neutral-900 px-4 py-2 text-sm font-medium text-neutral-300 transition hover:bg-neutral-800 hover:text-white active:bg-neutral-700">All</button>

      <button type="button" data-filter="text" class="rounded-lg  hover:cursor-pointer border border-neutral-800 bg-neutral-900 px-4 py-2 text-sm font-medium text-neutral-300 transition hover:bg-neutral-800 hover:text-white active:bg-neutral-700">Text</button>
      <button type="button" data-filter="credentials" class="rounded-lg  hover:cursor-pointer border border-neutral-800 bg-neutral-900 px-4 py-2 text-sm font-medium text-neutral-300 transition hover:bg-neutral-800 hover:text-white active:bg-neutral-700">Credentials</button>
      <button type="button" data-filter="images" class="rounded-lg border hover:cursor-pointer  border-neutral-800 bg-neutral-900 px-4 py-2 text-sm font-medium text-neutral-300 transition hover:bg-neutral-800 hover:text-white active:bg-neutral-700">Images</button>
      <button type="button" data-filter="docs" class="rounded-lg  hover:cursor-pointer border border-neutral-800 bg-neutral-900 px-4 py-2 text-sm font-medium text-neutral-300 transition hover:bg-neutral-800 hover:text-white active:bg-neutral-700">Docs</button>
    </section>

    <!-- Upload button -->
    <section class="mt-6">
      <button id="open-upload" type="button" class="flex items-center gap-3 rounded-xl border border-neutral-800 bg-neutral-900 px-5 py-3 text-base font-semibold text-neutral-100 shadow-sm transition hover:border-neutral-700 hover:bg-neutral-800 active:bg-neutral-700">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-blue-500/15 text-blue-400">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4m0 0-4 4m4-4 4 4" />
            <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" />
          </svg>
        </span>
        Upload
      </button>
    </section>

    <!-- Main data area: cards are rendered here by the script below -->
    <section id="content" class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"></section>

  </main>
  <p id="loadError" class="hidden text-center text-sm text-red-500"></p>
            <button type="button" id="showMore" class="rounded-lg hidden ml-8 mt-2 hover:cursor-pointer hover:bg-blue-500 px-4 py-2 text-sm  border-neutral-800 bg-neutral-900 font-medium text-white transition active:bg-blue-700">Show more</button>

  <!-- Upload modal (one box, switches between views) -->
  <div id="upload-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4" role="dialog" aria-modal="true" aria-labelledby="upload-title">
    <div class="flex min-h-96 w-full max-w-lg flex-col rounded-2xl border border-neutral-800 bg-neutral-900 p-6 shadow-xl">

      <!-- Modal header -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <button id="back-upload" type="button" aria-label="Back" class="hidden h-9 w-9 items-center justify-center rounded-lg text-neutral-400 transition hover:bg-neutral-800 hover:text-white active:bg-neutral-700">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 6-6 6 6 6" />
            </svg>
          </button>
          <h2 id="upload-title" class="text-lg font-semibold">Upload</h2>
        </div>
        <button id="close-upload" type="button" aria-label="Close" class="flex h-9 w-9 items-center justify-center rounded-lg text-neutral-400 transition hover:bg-neutral-800 hover:text-white active:bg-neutral-700">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>

      <!-- View: choose type -->
      <div data-view="menu" class="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-2">
        <button type="button" data-target="text" class="flex flex-col items-start gap-3 rounded-xl border border-neutral-800 bg-neutral-950 p-5 text-left transition hover:border-blue-500 hover:bg-neutral-800 active:bg-neutral-700">
          <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-sky-500/15 text-sky-400">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6V4h14v2M12 4v16m-3 0h6" /></svg>
          </span>
          <span class="text-base font-medium">Upload text</span>
        </button>

        <button type="button" data-target="credentials" class="flex flex-col items-start gap-3 rounded-xl border border-neutral-800 bg-neutral-950 p-5 text-left transition hover:border-blue-500 hover:bg-neutral-800 active:bg-neutral-700">
          <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-amber-500/15 text-amber-400">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4" /><path d="m11 12 9-9m-3 3 3 3m-6-3 2 2" /></svg>
          </span>
          <p class="modalmessage text-sm text-red-600 hidden">Login to upload credentials</p>
          <span class="text-base font-medium">Upload credentials</span>
        </button>

        <button type="button" data-target="images" class="flex flex-col items-start gap-3 rounded-xl border border-neutral-800 bg-neutral-950 p-5 text-left transition hover:border-blue-500 hover:bg-neutral-800 active:bg-neutral-700">
          <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-emerald-500/15 text-emerald-400">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="9" cy="10" r="2" /><path d="m21 16-5-5-9 9" /></svg>
          </span>
                    <p class="modalmessage text-sm text-red-600 hidden">Login to upload Images</p>

          <span class="text-base font-medium">Upload images</span>
        </button>

        <button type="button" data-target="docs" class="flex flex-col items-start gap-3 rounded-xl border border-neutral-800 bg-neutral-950 p-5 text-left transition hover:border-blue-500 hover:bg-neutral-800 active:bg-neutral-700">
          <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-violet-500/15 text-violet-400">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z" /><path d="M14 3v5h5M9 13h6m-6 4h6" /></svg>
          </span>
                    <p class="modalmessage text-sm text-red-600 hidden">Login to upload Docs</p>

          <span class="text-base font-medium">Upload docs</span>
        </button>
      </div>

      <!-- View: text -->
      <form data-view="text" class="mt-5 hidden flex-1 flex-col gap-4">
          <input
          id="text-title"
            type="text"
            name="title"
            required
            placeholder="Title"
            class="h-12 w-full rounded-xl border border-neutral-800 bg-neutral-950 px-4 text-base text-neutral-100 placeholder:text-neutral-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
          />
        <textarea
        id="text-content"
          name="content"
          required
          placeholder="Type or paste your text here"
          class="min-h-48 w-full flex-1 resize-none rounded-xl border border-neutral-800 bg-neutral-950 p-4 text-base text-neutral-100 placeholder:text-neutral-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
        ></textarea>
         <div id="text-msg" class=" mt-2 mb-2 h-1.5 text-red-800"></div>
        <button type="button" id="text-submit" class="h-12 w-full rounded-xl bg-blue-500 text-base font-semibold text-white shadow-sm transition hover:bg-blue-400 active:bg-blue-600">Upload</button>
      </form>

      <!-- View: credentials -->
      <form data-view="credentials" class="mt-5 hidden flex-1 flex-col gap-4">
        <div class="flex flex-1 flex-col gap-3">
          <input
            type="text"
            id="credentials-title"
            name="title"
            required
            placeholder="Title"
            class="h-12 w-full rounded-xl border border-neutral-800 bg-neutral-950 px-4 text-base text-neutral-100 placeholder:text-neutral-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
          />
          <input
            type="text"
            id="credentials-username"
            name="username"
            required
            autocomplete="off"
            placeholder="Username or email"
            class="h-12 w-full rounded-xl border border-neutral-800 bg-neutral-950 px-4 text-base text-neutral-100 placeholder:text-neutral-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
          />
          <input
            type="password"
            id="credentials-password"
            name="password"
            required
            autocomplete="new-password"
            placeholder="Password"
            class="h-12 w-full rounded-xl border border-neutral-800 bg-neutral-950 px-4 text-base text-neutral-100 placeholder:text-neutral-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
          />
        </div>
                 <div id="credentials-msg" class=" mt-2 mb-2 h-1.5 text-red-800"></div>

        <button type="button" id="credentials-submit" class="h-12 w-full rounded-xl bg-blue-500 text-base font-semibold text-white shadow-sm transition hover:bg-blue-400 active:bg-blue-600">Upload</button>
      </form>

      <!-- View: images -->
      <form data-view="images" class="mt-5 hidden flex-1 flex-col gap-4">
          <input
          id="image-title"
            type="text"
            name="title"
            required
            placeholder="Title"
            class="h-12 w-full rounded-xl border border-neutral-800 bg-neutral-950 px-4 text-base text-neutral-100 placeholder:text-neutral-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
          />
        <label class="flex flex-1 cursor-pointer flex-col items-center justify-center gap-3 rounded-xl border border-dashed border-neutral-700 bg-neutral-950 p-6 text-center transition hover:border-blue-500 hover:bg-neutral-800 active:bg-neutral-700">
          <span class="flex h-14 w-14 items-center justify-center rounded-xl bg-blue-500/15 text-blue-400">
            <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V4m0 0-4 4m4-4 4 4" />
              <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" />
            </svg>
          </span>
          <span class="text-base font-medium">Choose an image</span>
          <span data-file-name class="max-w-full truncate text-sm text-neutral-400">No file selected</span>
          <input type="file" id="image-file" name="file" accept="image/*" required class="hidden" />
        </label>
                 <div id="image-msg" class=" mt-2 mb-2 h-1.5 text-red-800"></div>

        <button type="button" id="image-submit" class="h-12 w-full rounded-xl bg-blue-500 text-base font-semibold text-white shadow-sm transition hover:bg-blue-400 active:bg-blue-600">Upload</button>
      </form>

      <!-- View: docs -->
      <form data-view="docs" class="mt-5 hidden flex-1 flex-col gap-4">
          <input
            type="text"
            id="doc-title"
            name="title"
            required
            placeholder="Title"
            class="h-12 w-full rounded-xl border border-neutral-800 bg-neutral-950 px-4 text-base text-neutral-100 placeholder:text-neutral-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
          />
        <label class="flex flex-1 cursor-pointer flex-col items-center justify-center gap-3 rounded-xl border border-dashed border-neutral-700 bg-neutral-950 p-6 text-center transition hover:border-blue-500 hover:bg-neutral-800 active:bg-neutral-700">
          <span class="flex h-14 w-14 items-center justify-center rounded-xl bg-blue-500/15 text-blue-400">
            <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V4m0 0-4 4m4-4 4 4" />
              <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" />
            </svg>
          </span>
          <span class="text-base font-medium">Choose a document</span>
          <span data-file-name class="max-w-full truncate text-sm text-neutral-400">No file selected</span>
          <input type="file" id="doc-file" name="file" accept=".pdf,.doc,.docx,.txt,.ppt,.pptx,.xls,.xlsx,.csv" required class="hidden" />
        </label>
        <div id="doc-msg" class="mt-2 mb-2 h-1.5 text-red-800"></div>
        <button type="button" id="doc-submit" class="h-12 w-full rounded-xl bg-blue-500 text-base font-semibold text-white shadow-sm transition hover:bg-blue-400 active:bg-blue-600">Upload</button>
      </form>

    </div>
  </div>
  <!-- AI analyze: step 1, choose the language -->
  <div id="analyze-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4" role="dialog" aria-modal="true" aria-labelledby="analyze-title">
    <div class="flex w-full max-w-md flex-col gap-5 rounded-2xl border border-neutral-800 bg-neutral-900 p-6 shadow-xl">
      <div class="flex items-center justify-between">
        <h2 id="analyze-title" class="text-lg font-semibold">Analyze with AI</h2>
        <button id="close-analyze" type="button" aria-label="Close" class="flex h-9 w-9 items-center justify-center rounded-lg text-neutral-400 transition hover:bg-neutral-800 hover:text-white active:bg-neutral-700">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <p id="analyze-item" class="truncate text-sm text-neutral-400"></p>
      <label class="flex flex-col gap-2 text-sm text-neutral-300">
        Summary language
        <select id="analyze-language" class="h-12 w-full rounded-xl border border-neutral-800 bg-neutral-950 px-4 text-base text-neutral-100 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30"></select>
      </label>
      <button id="analyze-start" type="button" class="h-12 w-full rounded-xl bg-blue-500 text-base font-semibold text-white shadow-sm transition hover:bg-blue-400 active:bg-blue-600">Analyze</button>
    </div>
  </div>

  <!-- AI analyze: step 2, the result -->
  <div id="analysis-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4" role="dialog" aria-modal="true" aria-labelledby="analysis-title">
    <div class="flex max-h-full min-h-96 w-full max-w-4xl flex-col rounded-2xl border border-neutral-800 bg-neutral-900 p-6 shadow-xl">
      <div class="flex items-start justify-between gap-4">
        <div class="min-w-0">
          <h2 id="analysis-title" class="truncate text-lg font-semibold">AI summary</h2>
          <p id="analysis-sub" class="mt-1 text-sm text-neutral-400"></p>
        </div>
        <button id="close-analysis" type="button" aria-label="Close" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-neutral-400 transition hover:bg-neutral-800 hover:text-white active:bg-neutral-700">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div id="analysis-body" class="mt-5 flex-1 overflow-y-auto whitespace-pre-wrap break-words rounded-xl border border-neutral-800 bg-neutral-950 p-5 text-base leading-relaxed text-neutral-200"></div>
      <div class="mt-4 flex justify-end">
        <button id="analysis-copy" type="button" class="hidden rounded-lg border border-neutral-700 bg-neutral-900 px-4 py-2 text-sm font-medium text-neutral-200 transition hover:bg-neutral-800 active:bg-neutral-700">Copy</button>
      </div>
    </div>
  </div>

<script src="/dashboard.js"></script>
</body>
</html>
