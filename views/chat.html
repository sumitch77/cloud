<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuickChat</title>
  <link rel="stylesheet" href="/output.css">
 <meta name="description" content="VeltoChat is a private messaging feature built for secure, real-time conversations. Messages are relayed through our servers without being stored, helping keep your chats private. Connect and communicate with a focus on security and minimal data retention.">
</head>
<body class="flex h-dvh flex-col overflow-hidden bg-neutral-950 text-neutral-100 antialiased">

  <!-- Header -->
  <header class="w-full shrink-0 border-b border-neutral-800 bg-neutral-950">
    <div class="flex h-16 items-center justify-between px-4 sm:px-6">

      <!-- Logo -->
      <div class="flex items-center gap-3">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-500 text-white">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11.5a7.5 7.5 0 0 1-10.9 6.7L4 19.5l1.3-4.4A7.5 7.5 0 1 1 20 11.5z" />
            <path d="M9 11.5h.01M12.5 11.5h.01M16 11.5h.01" />
          </svg>
        </span>
        <h1 class="text-xl font-semibold tracking-tight">QuickChat</h1>
      </div>

      <!-- Logged in user (filled by the script) -->
      <div id="me" class="hidden items-center gap-2 rounded-lg border border-neutral-800 bg-neutral-900 px-3 py-2 text-sm font-medium text-neutral-200"></div>
    </div>
  </header>

  <!-- Search -->
  <section class="shrink-0 border-b border-neutral-800 px-4 py-3 sm:px-6">
    <div class="flex gap-3">
      <div class="relative flex-1">
        <svg class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-neutral-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10" cy="10" r="6" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <input
          id="search"
          type="text"
          maxlength="50"
          autocomplete="off"
          placeholder="Search users to chat"
          class="h-12 w-full rounded-xl border border-neutral-800 bg-neutral-900 pl-12 pr-4 text-base text-neutral-100 shadow-sm placeholder:text-neutral-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
        />
      </div>
      <button id="search-btn" type="button" class="flex h-12 items-center justify-center gap-2 rounded-xl bg-blue-500 px-4 text-base font-semibold text-white shadow-sm transition hover:bg-blue-400 active:bg-blue-600 sm:px-8">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10" cy="10" r="6" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <span class="hidden sm:inline">Search</span>
      </button>
    </div>
  </section>

  <!-- Chat area: list on the left, conversation on the right -->
  <main class="relative flex min-h-0 flex-1">

    <!-- Left: users -->
    <aside class="flex min-h-0 w-full flex-col md:w-80 md:shrink-0 md:border-r md:border-neutral-800 lg:w-96">
      <div id="list" class="flex-1 overflow-y-auto p-2"></div>
    </aside>

    <!-- Right: nothing selected (hidden on phones) -->
    <section id="empty-pane" class="hidden min-w-0 flex-1 flex-col items-center justify-center gap-4 p-6 text-center md:flex">
      <span class="flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-500/15 text-blue-400">
        <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 11.5a7.5 7.5 0 0 1-10.9 6.7L4 19.5l1.3-4.4A7.5 7.5 0 1 1 20 11.5z" />
          <path d="M9 11.5h.01M12.5 11.5h.01M16 11.5h.01" />
        </svg>
      </span>
      <p class="text-base font-medium text-neutral-300">Click any chat to open</p>
    </section>

    <!-- Right: open conversation (on phones it covers the list) -->
    <section id="chat-pane" class="absolute inset-0 z-10 hidden min-w-0 flex-col bg-neutral-950 md:static md:z-auto md:flex-1">

      <div class="flex h-16 shrink-0 items-center gap-3 border-b border-neutral-800 px-4">
        <button id="back" type="button" aria-label="Back to chats" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-neutral-400 transition hover:bg-neutral-800 hover:text-white active:bg-neutral-700 md:hidden">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 6-6 6 6 6" />
          </svg>
        </button>
        <span id="chat-avatar" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-blue-500/15 text-base font-semibold text-blue-400"></span>
        <p id="chat-name" class="min-w-0 truncate text-base font-semibold text-neutral-100"></p>
      </div>

      <div id="messages" class="flex min-h-0 flex-1 flex-col gap-2 overflow-y-auto p-4"></div>

      <p id="chat-error" class="hidden px-4 pb-2 text-sm text-red-500"></p>

      <form id="send-form" class="flex shrink-0 items-center gap-3 border-t border-neutral-800 p-4">
        <input
          id="message-input"
          type="text"
          maxlength="1000"
          autocomplete="off"
          placeholder="Type a message"
          class="h-12 min-w-0 flex-1 rounded-xl border border-neutral-800 bg-neutral-900 px-4 text-base text-neutral-100 placeholder:text-neutral-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
        />
        <button id="send-btn" type="submit" aria-label="Send" class="flex h-12 items-center justify-center gap-2 rounded-xl bg-blue-500 px-4 text-base font-semibold text-white shadow-sm transition hover:bg-blue-400 active:bg-blue-600 disabled:opacity-50 sm:px-6">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2 11 13" />
            <path d="M22 2 15 22l-4-9-9-4 20-7z" />
          </svg>
          <span class="hidden sm:inline">Send</span>
        </button>
      </form>
    </section>

  </main>

<script src="/chat.js"></script>
</body>
</html>
